# ===================================================================
# YASB Configuration File
# Yet Another Status Bar - Main Configuration
#
# このファイルは、YASBの動作とウィジェットの設定を定義します。
# 各セクションは論理的にグループ化され、コメントで説明されています。
#
# For more information: https://github.com/amnweb/yasb/wiki
# ===================================================================

# ===================================================================
# GLOBAL SETTINGS - グローバル設定
# ===================================================================

# 自動リロード設定
watch_stylesheet: true  # CSSファイルの変更を監視して自動リロード
watch_config: true      # config.yamlの変更を監視して自動リロード

# デバッグとアップデート
debug: false            # デバッグモード（トラブルシューティング時にtrueに）
update_check: true      # 起動時に自動的にアップデートをチェック

# ===================================================================
# KOMOREBI SETTINGS - ウィンドウマネージャー設定
# ===================================================================

komorebi:
  start_command: "komorebic start --whkd"
  stop_command: "komorebic stop --whkd"
  reload_command: "komorebic stop --whkd && komorebic start --whkd"

# ===================================================================
# BAR CONFIGURATION - ステータスバー設定
# ===================================================================

bars:
  primary-bar:
    enabled: true
    screens: ["*"]  # すべての未割り当て画面に表示（"**" = すべての画面）
    class_name: "yasb-bar"

    # バーの配置
    alignment:
      position: "top"   # トップバー（"bottom" も可能）
      center: false     # 中央揃えしない

    # アニメーション設定
    animation:
      enabled: true
      duration: 400     # ミリ秒

    # ブラー効果（Windows 11 のみ）
    blur_effect:
      enabled: false
      acrylic: false
      dark_mode: false
      round_corners: false
      round_corners_type: "normal"
      border_color: "system"

    # ウィンドウフラグ
    window_flags:
      always_on_top: false
      windows_app_bar: true  # Windowsアプリバーとして登録

    # サイズ設定
    dimensions:
      width: "100%"
      height: 32

    # パディング
    padding:
      top: 4
      left: 4
      bottom: 0
      right: 4

    # ウィジェット配置
    widgets:
      left:
        - "home"
        - "whkd"
        - "komorebi_workspaces"
        - "komorebi_active_layout"
        - "active_window"
      center:
        - "weather"
        - "clock"
        - "apps"
        - "memory"
      right:
        - "cava"
        - "media"
        - "disk"
        - "language"
        - "microphone"
        - "volume"
        - "notifications"
        - "power_menu"

# ===================================================================
# WIDGET DEFINITIONS - ウィジェット定義
# ===================================================================

widgets:
  # =================================================================
  # SYSTEM WIDGETS - システムウィジェット
  # =================================================================

  # --- Home Widget: クイックアクセスメニュー ---
  home:
    type: "yasb.home.HomeWidget"
    options:
      label: "<span>\udb81\udf17</span>"
      menu_list:
        - { title: "User Home", path: "~" }
        - { title: "Download", path: "~\\Downloads" }
        - { title: "Documents", path: "~\\Documents" }
        - { title: "Pictures", path: "~\\Pictures" }
      system_menu: true
      power_menu: true
      blur: false

  # --- Launchpad Widget: アプリケーションランチャー（コメントアウト済み） ---
  launchpad:
    type: "yasb.launchpad.LaunchpadWidget"
    options:
      label: "<span>\udb85\udcde</span>"
      search_placeholder: "Search apps..."
      app_icon_size: 48
      window:
        fullscreen: true
        overlay_block: true
      window_style:
        enable_blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
      window_animation:
        fade_in_duration: 200
        fade_out_duration: 200
      callbacks:
        on_left: "toggle_launchpad"

  # =================================================================
  # WINDOW MANAGER WIDGETS - ウィンドウマネージャーウィジェット
  # =================================================================

  # --- WHKD Widget: キーバインディング表示 ---
  whkd:
    type: "yasb.whkd.WhkdWidget"
    options:
      label: "<span>\uf11c</span>"
      special_keys:
        - { key: "win", key_replace: "\ue70f" }
        - { key: "ctrl", key_replace: "Ctrl" }
        - { key: "alt", key_replace: "Alt" }
        - { key: "shift", key_replace: "Shift" }
        - { key: "left", key_replace: "\u2190" }
        - { key: "right", key_replace: "\u2192" }
        - { key: "up", key_replace: "\u2191" }
        - { key: "down", key_replace: "\u2193" }

  # --- Komorebi Workspaces: ワークスペース表示 ---
  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "\u23fc Offline"
      label_workspace_btn: "\u000d"
      label_workspace_active_btn: "\u000d"
      label_workspace_populated_btn: "\u000d"
      label_default_name: "{index}"
      label_zero_index: false
      hide_empty_workspaces: false
      hide_if_offline: true
      animation: true

  # --- Komorebi Active Layout: レイアウト表示 ---
  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "{icon}"
      layouts:
        - "bsp"
        - "columns"
        - "rows"
        - "grid"
        - "vertical_stack"
        - "horizontal_stack"
        - "ultrawide_vertical_stack"
        - "right_main_vertical_stack"
      layout_icons:
        bsp: "BSP"
        columns: "COLS"
        rows: "ROWS"
        grid: "GRID"
        vertical_stack: "V-STACK"
        horizontal_stack: "H-STACK"
        ultrawide_vertical_stack: "W-STACK"
        right_main_vertical_stack: "RMV-STACK"
        monocle: "MONOCLE"
        maximized: "MAX"
        floating: "FLOATING"
        paused: "PAUSED"
      callbacks:
        on_left: "next_layout"
        on_middle: "toggle_monocle"
        on_right: "prev_layout"

  # --- Active Window: アクティブウィンドウタイトル表示 ---
  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "[class_name='{win[class_name]}' exe='{win[process][name]}' hwnd={win[hwnd]}]"
      label_no_window: ""
      label_icon: true
      label_icon_size: 14
      max_length: 30
      max_length_ellipsis: "..."
      monitor_exclusive: true

  # =================================================================
  # INFORMATION WIDGETS - 情報表示ウィジェット
  # =================================================================

  # --- Clock Widget: 時計・カレンダー ---
  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "<span>{icon}</span> <span>{alarm}</span> {%y/%m/%d %H:%M:%S}"
      label_alt: "\uf017 {%d-%m-%y %H:%M:%S}"
      locale: ""
      update_interval: 1000
      timezones: []
      icons:
        clock_01: "\udb85\udc3f"
        clock_02: "\udb85\udc40"
        clock_03: "\udb85\udc41"
        clock_04: "\udb85\udc42"
        clock_05: "\udb85\udc43"
        clock_06: "\udb85\udc44"
        clock_07: "\udb85\udc45"
        clock_08: "\udb85\udc46"
        clock_09: "\udb85\udc47"
        clock_10: "\udb85\udc48"
        clock_11: "\udb85\udc49"
        clock_12: "\udb85\udc4a"
      alarm_icons:
        enabled: "\uf0f3"
        disabled: "\uf0a2"
        snooze: "\uf1f6"
      calendar:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_holidays: false
        show_week_numbers: true
        country_code: "JP"  # 日本の祝日を表示
        holiday_color: "#FF6464"
        extended: false
      callbacks:
        on_left: "toggle_calendar"
        on_middle: "next_timezone"
        on_right: "toggle_label"
      keybindings:
        - keys: "win+c"
          action: "toggle_calendar"
      container_padding:
        top: 0
        left: 0
        bottom: 0
        right: 0

  # --- Weather Widget: 天気予報 ---
  weather:
    type: "yasb.weather.WeatherWidget"
    options:
      label: "<span>{icon}</span> {temp}"
      label_alt: "{location}: Min {min_temp}, Max {max_temp}, Humidity {humidity}"
      api_key: "$env:YASB_WEATHER_API_KEY"
      show_alerts: true
      tooltip: true
      update_interval: 600  # 10分ごとに更新（最小値: 600秒）
      hide_decimal: true
      units: "metric"
      location: "Kanagawa, Yokohama, 2240023"
      callbacks:
        on_left: "toggle_card"
        on_right: "toggle_label"
      keybindings:
        - keys: "win+w"
          action: "toggle_card"
      icons:
        sunnyDay: "\ue30d"
        clearNight: "\ue32b"
        cloudyDay: "\ue312"
        cloudyNight: "\ue311"
        rainyDay: "\ue308"
        rainyNight: "\ue333"
        snowyDay: "\ue30a"
        snowyNight: "\ue335"
        blizzardDay: "\udb83\udf36"
        blizzardNight: "\udb83\udf36"
        foggyDay: "\ue303"
        foggyNight: "\ue346"
        thunderstormDay: "\ue30f"
        thunderstormNight: "\ue338"
        default: "\uebaa"
      weather_card:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        icon_size: 64
        show_hourly_forecast: true
        time_format: "24h"
        hourly_point_spacing: 76
        hourly_icon_size: 32
        icon_smoothing: true
        temp_line_width: 2
        current_line_color: "#8EAEE8"
        current_line_width: 1
        current_line_style: "dot"

  # --- CPU Widget: CPU使用率（コメントアウト済み） ---
  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uf4bc</span> {info[percent][total]}%"
      update_interval: 2000
      cpu_thresholds:
        low: 25
        medium: 50
        high: 90

  # --- Memory Widget: メモリ使用率 ---
  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\uefc5</span>{virtual_mem_percent}%"
      update_interval: 5000
      memory_thresholds:
        low: 25
        medium: 50
        high: 90

  # --- Disk Widget: ディスク使用率 ---
  disk:
    type: "yasb.disk.DiskWidget"
    options:
      label: "{volume_label} {space[used][percent]}"
      label_alt: "{volume_label} {space[used][gb]} / {space[total][gb]}"
      volume_label: "C"
      update_interval: 60
      group_label:
        volume_labels: ["C", "E", "F", "G", "H"]
        show_label_name: true
        blur: true
        round_corners: true
        round_corners_type: "small"
        border_color: "system"
        alignment: "right"
        direction: "down"
      callbacks:
        on_left: "toggle_group"
        on_middle: "toggle_label"
        on_right: "exec explorer C:\\"
      disk_thresholds:
        low: 25
        medium: 50
        high: 90

  # =================================================================
  # MEDIA WIDGETS - メディアウィジェット
  # =================================================================

  # --- Media Widget: メディア再生コントロール ---
  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title}{s}{artist}"
      label_alt: "{title}"
      separator: " - "
      hide_empty: true
      callbacks:
        on_left: "toggle_media_menu"
      max_field_size:
        label: 20
        label_alt: 30
      show_thumbnail: true
      controls_only: false
      controls_left: true
      controls_hide: false
      thumbnail_alpha: 80
      thumbnail_padding: 8
      thumbnail_corner_radius: 16
      icons:
        prev_track: "\ue892"
        next_track: "\ue893"
        play: "\ue768"
        pause: "\ue769"
    media_menu:
      blur: false
      round_corners: true
      round_corners_type: "normal"
      border_color: "system"
      alignment: "right"
      direction: "down"
      offset_top: 6
      offset_left: 0
      thumbnail_corner_radius: 8
      thumbnail_size: 120
      max_title_size: 60
      max_artist_size: 20
      show_source: true
      show_volume_slider: false
    media_menu_icons:
      play: "\ue768"
      pause: "\ue769"
      prev_track: "\ue892"
      next_track: "\ue893"
      mute: "\ue994"
      unmute: "\ue74f"
    scrolling_label:
      enabled: false
      update_interval_ms: 33
      style: "left"
      separator: " | "
      label_padding: 1
      ease_slope: 20
      ease_pos: 0.8
      ease_min: 0.5

  # --- Cava Widget: オーディオビジュアライザー ---
  cava:
    type: "yasb.cava.CavaWidget"
    options:
      bar_height: 12
      min_bar_height: 0
      gradient: 1
      foreground: "#89b4fa"
      gradient_color_1: "#74c7ec"
      gradient_color_2: "#89b4fa"
      gradient_color_3: "#cba6f7"
      bars_number: 8
      bar_spacing: 2
      bar_width: 4
      bar_type: "bars"
      framerate: 60
      hide_empty: true

  # --- Volume Widget: ボリュームコントロール ---
  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "{volume}"
      volume_icons:
        - "\ueee8"  # ミュート
        - "\uf026"  # 0-10%
        - "\uf027"  # 11-30%
        - "\uf027"  # 31-60%
        - "\uf028"  # 61-100%
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
      callbacks:
        on_left: "toggle_volume_menu"
        on_right: "toggle_mute"
      keybindings:
        - keys: "win+v"
          action: "toggle_volume_menu"

  # --- Microphone Widget: マイク状態表示 ---
  microphone:
    type: "yasb.microphone.MicrophoneWidget"
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "<span>{icon}</span> {level}%"
      icons:
        normal: "\udb80\udf6c"
        muted: "\udb80\udf6d"
      callbacks:
        on_left: "toggle_mute"
        on_middle: "toggle_label"
        on_right: "exec cmd.exe /c start ms-settings:sound"

  # =================================================================
  # UTILITY WIDGETS - ユーティリティウィジェット
  # =================================================================

  # --- Language Widget: 入力言語表示 ---
  language:
    type: "yasb.language.LanguageWidget"
    options:
      label: "{lang[language_code]}-{lang[country_code]}"
      label_alt: "{lang[full_name]}"
      update_interval: 1
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_label"
      keybindings:
        - keys: "win+shift+l"
          action: "toggle_menu"
      language_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_layout_icon: true
        layout_icon: "\uf11c"

  # --- Notifications Widget: 通知表示 ---
  notifications:
    type: "yasb.notifications.NotificationsWidget"
    options:
      label: "<span>\uf476</span> {count}"
      label_alt: "{count} notifications"
      hide_empty: false
      tooltip: false
      callbacks:
        on_left: "toggle_notification"
        on_middle: "toggle_label"

  # --- Power Menu Widget: 電源メニュー ---
  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "\uf011"
      uptime: true
      show_user: true
      blur: false
      blur_background: true
      animation_duration: 120
      button_row: 3
      buttons:
        restart: ["\uead2", "Restart"]
        shutdown: ["\uf011", "Shut Down"]
        signout: ["\udb80\udf43", "Sign out"]
        hibernate: ["\uf28e", "Hibernate"]
        lock: ["\uea75", "Lock"]
        cancel: ["\udb81\udf3a", "Cancel"]
      keybindings:
        - keys: "win+shift+p"
          action: "toggle_power_menu"

  # --- Applications Widget: クイック起動アプリ ---
  apps:
    type: "yasb.applications.ApplicationsWidget"
    options:
      label: "{data}"
      app_list:
        - { icon: "\uf0a2", launch: "notification_center", name: "Notification Center" }
        - { icon: "\ueb51", launch: "quick_settings", name: "Settings" }
        - { icon: "\uf422", launch: "C:\\Program Files\\WindowsApps\\Microsoft.CommandPalette_0.6.2963.0_x64__8wekyb3d8bbwe\\Microsoft.CmdPal.UI.exe", name: "Command Palette" }
        - { icon: "\uf489", launch: "wt", name: "Windows Terminal" }
        - { icon: "\ue8da", launch: "C:\\Users\\hisui\\AppData\\Local\\Programs\\Microsoft VS Code\\Code.exe", name: "VS Code" }
